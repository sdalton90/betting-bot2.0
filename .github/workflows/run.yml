name: Free Scheduled Betting Bot
on:
  schedule:
    - cron: "0 18 * * *" # Runs daily at 1:00 PM EST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn
      - run: python betting_bot.py
      - name: Save updated CSV log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nba_picks_log.csv
          git diff --staged --quiet || git commit -m "Update picks CSV log"
          git push
